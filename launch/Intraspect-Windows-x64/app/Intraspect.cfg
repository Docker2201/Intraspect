[Application]
app.classpath=$APPDIR\CNC_Modeling.jar
app.mainclass=com.sergey.pisarev.Launcher
app.classpath=$APPDIR\lib\flowless-0.7.2.jar
app.classpath=$APPDIR\lib\reactfx-2.0-M5.jar
app.classpath=$APPDIR\lib\richtextfx-0.11.2.jar
app.classpath=$APPDIR\lib\undofx-2.1.1.jar
app.classpath=$APPDIR\lib\wellbehavedfx-0.3.3.jar

[JavaOptions]
java-options=-Djpackage.app-version=1.0
java-options=-Dfile.encoding=UTF-8
java-options=-Dchekator.occt.mesh=true
java-options=-Dprism.order=d3d,sw
java-options=--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED
java-options=--add-opens=javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED
java-options=--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED
