mcp.title=MCP — підключення нейромережі
mcp.heading=Підключення нейромережі до програми
mcp.about=Натисніть «Підключити» — програма запускає власний сервер і сама записує адресу в налаштування Claude Code та Codex. Після цього клієнта потрібно перезапустити, і нейромережа працює з програмою напряму: читає G-code й налаштування, править програму, додає інструменти, дивиться графік і 3D-модель. Сервер слухає лише цей комп'ютер (127.0.0.1) і потребує ключ.
mcp.port=Порт
mcp.stop=Вимкнути сервер
mcp.status.on=Сервер працює: порт %d, викликів %d, останній інструмент %s
mcp.status.off=Сервер вимкнено. Нейромережа підключитися не може.
mcp.access=Що дозволено нейромережі
mcp.access.full=Дозволити змінювати програму, налаштування та інструменти
mcp.access.read.about=Модель бачить програму, налаштування, інструменти й картинки, але нічого не змінює.
mcp.access.full.about=Модель може переписати програму, змінити налаштування та інструменти. Попередній текст програми лишається в історії правок.
mcp.address=Адреса для нейромережі (ключ уже всередині)
mcp.copy.address=Скопіювати адресу
mcp.hint=Адреса потрібна лише для клієнтів, яких «Підключити» не налаштовує. Ключ постійний, тому адресу достатньо записати один раз; після «Нового ключа» її потрібно записати знову.
mcp.journal=Що робила нейромережа
mcp.close=Закрити
mcp.log.copied=скопійовано в буфер обміну
mcp.log.startfailed=не вдалося увімкнути сервер:

