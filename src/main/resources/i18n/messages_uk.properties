diag.twoends.title=Точіння з двох кінців: %s, другий нуль не заданий
diag.twoends.details=Програма перемикається між нульовими точками %s — так пишуть програми осей: одна половина від одного торця, інша від іншого.\nZ другого нуля в налаштуваннях не заданий, тому обидві половини лягли від одного нуля: розібрана довжина %.0f мм проти заготовки %.0f мм. На графіку і в 3D деталь виходить довшою за себе, з перехопленням посередині.\nАвтовиправлення впише для G%d значення Z=%.0f — половини стануть на свої місця; значення потім можна уточнити в налаштуваннях.
diag.twoends.fix=Вписати G%d Z=%.0f
app.twoends.done=Вписано: G%d Z=%.0f — половини деталі стали на свої місця
