turnover.hint=Розміри спільної заготовки мають пріоритет над WORKPIECE в окремих каналах. Пропозицію розраховано за заготовкою першої сторони та її перевертанням; уточніть фактичні розміри. Зв’язок нулів задає Z₂ = вказане число − Z₁. У 3D показано результат обох сторін; цикл виконає сторону 1, перевертання і сторону 2. При 0 отвір відновлюється за наскрізними проходами NC з поточними значеннями з вікна «Параметри». Можна вказати фактичний початковий отвір вручну. Кінцевий діаметр розраховується за розточуванням. У режимі поковки контур обох сторін розширюється на припуск і обмежується заданими габаритами. Це наближення, а не креслення поковки. Запропонований припуск — найбільший OFFN з NC. Код програм не змінюється.
