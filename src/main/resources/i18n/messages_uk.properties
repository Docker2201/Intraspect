sim.support.tooltip=Вертикальні супорти X/Z. Подача F і оберти S — з NC.\nСинхронізацію PLC, розгін і зміну інструмента показано спрощено.\nМоделі інструментів — з Blender; радіус вершини береться з бібліотеки.\nЦикл показує знімання кромкою і пластиною; 3D — номінальний контур.\nМатеріал поза проходами зберігається. Вихідна форма і розміри WORKPIECE мають відповідати заготовці.
