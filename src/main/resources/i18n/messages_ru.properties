turnover.hint=Размеры общей заготовки имеют приоритет над WORKPIECE в отдельных каналах. Предложение рассчитано по заготовке первой стороны и её перевороту; уточните фактические размеры. Связь нулей задаёт Z₂ = указанное число − Z₁. В 3D показан результат обеих сторон; цикл выполнит сторону 1, переворот и сторону 2. При 0 отверстие восстанавливается по сквозным проходам NC с текущими значениями из окна «Параметры». Можно указать фактическое начальное отверстие вручную. Конечный диаметр рассчитывается по расточке. В режиме поковки контур обеих сторон расширяется на припуск и ограничивается заданными габаритами. Это приближение, не чертёж поковки. Предложенный припуск — максимальный OFFN из NC. Код программ не меняется.
