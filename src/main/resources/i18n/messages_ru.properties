diag.twoends.title=Точение с двух концов: %s, второй ноль не задан
diag.twoends.details=Программа переключается между нулевыми точками %s — так пишут программы осей: одна половина от одного торца, другая от другого.\nZ второго нуля в настройках не задан, поэтому обе половины легли от одного нуля: разобранная длина %.0f мм против заготовки %.0f мм. На графике и в 3D деталь выходит длиннее себя, с перехватом посередине.\nАвтоисправление впишет для G%d значение Z=%.0f — половины встанут на свои места; значение потом можно уточнить в настройках.
