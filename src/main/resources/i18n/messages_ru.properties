mcp.title=МСП — подключение нейросети
mcp.heading=Подключение нейросети к программе
mcp.about=Нажмите «Подключить» — программа поднимет у себя сервер и сама прописывает адрес в настройки Claude Code и Codex. После этого клиента надо перезапустить, и нейросеть будет работать с программой напрямую: читать G-code и настройки, править программу, добавлять инструменты, смотреть график и 3D. Сервер слушает только этот компьютер (127.0.0.1) и требует ключ.
