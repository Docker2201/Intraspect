sim.support.tooltip=Вертикальные суппорты X/Z. Подача F и обороты S — из NC.\nСинхронизация PLC, разгон и смена инструмента показаны упрощённо.\nМодели инструментов — из Blender; радиус вершины берётся из библиотеки.\nЦикл показывает снятие кромкой и пластиной; 3D — номинальный контур.\nМатериал вне проходов сохраняется. Исходная форма и размеры WORKPIECE должны соответствовать заготовке.
