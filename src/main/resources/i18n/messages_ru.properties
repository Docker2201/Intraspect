# Intraspect - interface text. Russian: the reference language, everything else is translated from here.
# UTF-8. Read with an explicit charset (see I18n), so real letters, not \u escapes.
# Rules for translators:
#   - keep every %s / %d / %.1f / %.0f placeholder, in the same order: they are filled in by the program;
#   - keep \n line breaks, and keep a leading or trailing \ space (it glues the text to a number);
#   - keep G-code words as they are: G54, G41, WORKPIECE, CYCLE95, DIAMON, T, D, OFFN, M30;
#   - the same key must exist in every language file.

