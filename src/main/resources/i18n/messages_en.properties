mcp.title=MCP — AI model connection
mcp.heading=Connecting the AI model to the program
mcp.about=Press "Connect" — the program starts a server and writes the address into the Claude Code and Codex settings itself. After that the client has to be restarted, and the AI model works with the program directly: it reads the G-code and settings, edits the program, adds tools, and looks at the graph and the 3D model. The server only listens on this computer (127.0.0.1) and requires a key.
mcp.port=Port
mcp.stop=Stop server
mcp.status.on=Server running: port %d, calls %d, last tool %s
mcp.status.off=Server is off. The AI model cannot connect.
mcp.access=What the AI model may do
mcp.access.full=Allow changing the program, settings and tools
mcp.access.read.about=The model sees the program, settings, tools and images, but changes nothing.
mcp.access.full.about=The model can rewrite the program and change settings and tools. The previous program text stays in the edit history.
mcp.address=Address for the AI model (key already included)
mcp.copy.address=Copy address
mcp.hint=The address is only needed for clients that "Connect" does not configure. The key is permanent, so the address only needs to be written in once; after "New key" it has to be written in again.
