turnover.hint=The shared workpiece dimensions take priority over WORKPIECE in the individual channels. The suggestion is based on the first-side blank and its turnover; check the actual dimensions. The zero link sets Z₂ = the given number − Z₁. 3D shows the result of both sides; the cycle runs side 1, the turnover and side 2. With 0, the bore is reconstructed from the NC through-passes using the current values from the Parameters window. You can enter the actual initial bore manually. The final diameter comes from the boring. In forging mode the contour of both sides is expanded by the allowance and limited to the given size. This is an approximation, not a forging drawing. The suggested allowance is the largest OFFN in the NC. The programs are not changed.
