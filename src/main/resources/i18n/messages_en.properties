diag.twoends.title=Turning from both ends: %s, second zero not set
diag.twoends.details=The program switches between zero points %s — that is how axle programs are written: one half from one end face, the other from the other.\nThe Z value of the second zero is not set in the settings, so both halves are drawn from the same zero: parsed length %.0f mm against a blank of %.0f mm. On the graph and in 3D the part comes out longer than itself, with a waist in the middle.\nThe fix will enter G%d Z=%.0f — the halves will fall into place; the value can then be refined in the settings.
diag.twoends.fix=Enter G%d Z=%.0f
app.twoends.done=Entered: G%d Z=%.0f — the halves of the part fell into place
